name: Publish SoloHost image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Validate curriculum
        run: npm test

      - name: Build application
        run: npm run build

      - name: Create production source ZIP
        run: |
          zip -r AI-HomeSchool-Production.zip .             -x ".git/*"             -x ".github/*"             -x "node_modules/*"             -x ".next/*"             -x ".env*"             -x "AI-HomeSchool-Production.zip"

      - name: Upload production ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AI-HomeSchool-Production
          path: AI-HomeSchool-Production.zip
          if-no-files-found: error
          retention-days: 30

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/roberhood314/homeschooling:latest
            ghcr.io/roberhood314/homeschooling:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
